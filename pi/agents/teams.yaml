# teams.yaml — team definitions for agent-team.ts
#
# Schema (see agent-team-config.ts's parseTeamsYaml — a minimal hand-rolled
# parser, not a full YAML implementation):
#
#   <team-name>:
#     - <agent-name>
#     - <agent-name>:
#         extensions:
#           - <bare-extension-name>
#           - ~/path/to/extension.ts
#
# Rules:
# - Team name must end the line with ":" (no inline value).
# - Each member name must match an agent's frontmatter `name:` field
#   case-insensitively (not the filename).
# - `extensions` is optional. A bare name resolves to
#   <agent-dir>/extensions/<name>.ts (PI_CODING_AGENT_DIR); `~/...` paths expand from the home directory.
# - No inline lists or other per-member metadata.
#
# Agent definitions load from project directories (<cwd>/agents/,
# <cwd>/.claude/agents/, <cwd>/.pi/agents/), ~/.claude/agents/, and
# <agent-dir>/agents/. Teams load from <agent-dir>/agents/teams.yaml and
# <cwd>/.pi/agents/teams.yaml; project definitions override globals.

plan-build-review:
  - planner
  - builder
  - reviewer

scout-review-architect:
  - scout
  - reviewer
  - architect

mvps:
  - scout:
    extensions:
