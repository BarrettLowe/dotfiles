# teams.yaml — team definitions for agent-team.ts
#
# Schema (see agent-team-config.ts's parseTeamsYaml — a minimal hand-rolled
# parser, not a full YAML implementation):
#
#   <team-name>:
#     - <agent-name>
#     - <agent-name>:
#         extensions:
#           - <bare-extension-name>
#           - ~/path/to/extension.ts
#
# Rules:
# - Team name must end the line with ":" (no inline value).
# - Each member name must match an agent's frontmatter `name:` field
#   case-insensitively (not the filename).
# - `extensions` is optional. A bare name resolves to
#   ~/.pi/agent/extensions/<name>.ts; `~/...` paths expand from the home directory.
# - No inline lists or other per-member metadata.
#
# NOTE: agent-team.ts only scans agent .md files from project-relative
# directories (<cwd>/agents/, <cwd>/.claude/agents/, <cwd>/.pi/agents/) and
# reads this file from <cwd>/.pi/agents/teams.yaml. Copy or symlink this file
# and your agent .md files into a project's .pi/agents/ directory before
# running `pi -e extensions/agent-team.ts` there.

plan-build-review:
  - planner
  - builder
  - reviewer

scout-review-architect:
  - scout
  - reviewer
  - architect

underdogs:
  - planner:
    extensions:
      ~/.pi/agent/extensions/model-access-guard.ts
  - builder:
    extensions:
      ~/.pi/agent/extensions/model-access-guard.ts
  - reviewer:
    extensions:
      ~/.pi/agent/extensions/model-access-guard.ts
  - qa:
    extensions:
      ~/.pi/agent/extensions/model-access-guard.ts
  - bd:
    extensions:
      ~/.pi/agent/extensions/model-access-guard.ts
